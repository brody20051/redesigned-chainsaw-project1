<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | Lights Out Racing</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- cool racing font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background-color: black;
      margin: 0;
      text-align: center;
      color: white;
      padding: 40px 20px;
    }

    /* Smaller Brand Title */
    .brand-title {
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    .slash {
      color: #ff1e1e;
      font-size: 2.8rem;
      display: inline-block;
      transform: skew(-15deg);
      margin: 0 8px;
    }

    .racing {
      color: #ff1e1e;
      letter-spacing: 4px;
    }

    /* Search Box */
    #searchInput {
      max-width: 400px;
      margin: 0 auto 30px auto;
    }

    #productList {
      list-style: none;
      padding: 0;
    }

    #productList li {
      margin: 10px 0;
      font-size: 1.1rem;
    }

    a {
      color: #ff1e1e;
      text-decoration: none;
    }

    a:hover {
      text-shadow: 0 0 8px #ff1e1e;
    }

  </style>
</head>

<body>

  <!-- Smaller Logo -->
  <h1 class="brand-title">
    Lights Out <span class="slash">/</span> <span class="racing">RACING</span>
  </h1>

  <h2>Search Products</h2>

  <input type="text" id="searchInput" class="form-control" placeholder="Search merch...">

  <ul id="productList">
    <li>Mustang Hoodie</li>
    <li>Supra T-Shirt</li>
    <li>BMW M3 Poster</li>
    <li>JDM Sticker Pack</li>
    <li>Drift Racing Hat</li>
  </ul>

  <br>
  <a href="index.html">← Back to Home</a>

  <script src="search.js"></script>

</body>
</html>
