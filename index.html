<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lights Out Racing</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Racing Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background-color: black;
      margin: 0;
      text-align: center;
      color: white;
    }

    /* Brand Title */
    .brand-title {
      font-size: 3.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-top: 60px;
    }

    .slash {
      color: #ff1e1e;
      font-size: 4.5rem;
      display: inline-block;
      transform: skew(-15deg);
      margin: 0 10px;
    }

    .racing {
      color: #ff1e1e;
      letter-spacing: 6px;
    }

    /* Navigation */
    nav ul {
      list-style: none;
      padding: 0;
      margin-top: 50px;
    }

    nav ul li {
      display: inline-block;
      margin: 0 25px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      transition: 0.3s ease;
    }

    nav ul li a:hover {
      color: #ff1e1e;
      text-shadow: 0 0 8px #ff1e1e;
    }

    h2 {
      margin-top: 60px;
      font-size: 1.8rem;
      letter-spacing: 2px;
    }

  </style>
</head>

<body>

  <!-- Logo -->
  <h1 class="brand-title">
    Lights Out <span class="slash">/</span> <span class="racing">RACING</span>
  </h1>

  <!-- Navigation -->
  <nav>
    <ul>
      <li><a href="plain login.html">Login</a></li>
      <li><a href="search.html">Search</a></li>
      <li><a href="pages/content.html">Content</a></li>
    </ul>
  </nav>

  <h2>Shop</h2>

  <script>
    console.log("Lights Out Racing loaded.");
  </script>

</body>
</html>
